release:
  draft: true
  prerelease: auto
project_name: octant
builds:
  -
    main: ./cmd/octant/main.go
    binary: octant
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    flags:
      - -tags=embedded
    ldflags: -X "main.buildTime={{.Date}}" -X "main.gitCommit={{.Commit}}" -X "main.version={{.Version}}"
nfpms:
  -
    formats:
      - deb
      - rpm
    vendor: "OctantR contributors"
    homepage: "https://github.com/m8yng/octant"
    maintainer: "m8yng"
    description: "An independent community revival of the Octant Kubernetes dashboard"
    license: "MIT and Apache-2.0"
    file_name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"
    replacements:
      darwin: macOS
      linux: Linux
      windows: Windows
      amd64: 64bit
      arm: ARM
      arm64: ARM64
archives:
  -
    wrap_in_directory: true
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"
    replacements:
      darwin: macOS
      linux: Linux
      windows: Windows
      amd64: 64bit
    files:
      - LICENSE
      - LICENSE-APACHE-2.0
      - NOTICE
      - README.md
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: SNAPSHOT-{{.Commit}}
